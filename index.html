<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Study Tracker</title>

  <!-- App Icon & Home Screen Name -->
  <link rel="icon" type="image/png" href="image.png" />
  <link rel="apple-touch-icon" href="image.png" />
  <meta name="apple-mobile-web-app-title" content="Study Tracker" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta id="meta-theme-color" name="theme-color" content="#F4F0E8" />
  <link rel="manifest" href="manifest.json" />

  <!-- Instant dark mode & RTL/LTR direction before first paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('study_tracker_theme');
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = (saved === 'dark' || (!saved && sysDark));
        if (isDark) {
          document.documentElement.classList.add('dark');
          var tc = document.getElementById('meta-theme-color');
          if (tc) tc.setAttribute('content', '#090C12');
        }
        var pal = localStorage.getItem('study_tracker_palette');
        if (pal === 'oxford' || pal === 'burgundy' || pal === 'ivory') {
          document.documentElement.setAttribute('data-palette', pal);
          var tc2 = document.getElementById('meta-theme-color');
          if (tc2) {
            if (pal === 'oxford') tc2.setAttribute('content', isDark ? '#07130E' : '#EFF4EF');
            else if (pal === 'burgundy') tc2.setAttribute('content', isDark ? '#14090D' : '#F8F1F2');
          }
        }
        var lang = localStorage.getItem('study_tracker_lang');
        if (lang === 'ar') {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    })();
  </script>

  <!-- 100% local CSS for instant boot -->
  <link rel="stylesheet" href="css/styles.css?v=78" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-6 transition-colors">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
    <div class="app-container mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <!-- Back to Focus (shown only on secondary screens) -->
        <button id="app-back-btn" type="button" class="hidden w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 shrink-0" aria-label="Back to Focus">
          <svg class="drawer-back-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </button>
        <!-- Hamburger Menu Button -->
        <button id="app-menu-btn" type="button" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 shrink-0" aria-label="Menu" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
            <line x1="4" y1="6.5" x2="20" y2="6.5"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="17.5" x2="20" y2="17.5"></line>
          </svg>
        </button>
        <img id="app-header-logo" src="image.png" alt="Logo" class="w-7 h-7 rounded-xl shrink-0" onerror="this.style.display='none'; document.getElementById('logo-fallback').classList.remove('hidden');" />
        <span id="logo-fallback" class="hidden text-xl">🎓</span>
        <div class="min-w-0">
          <h1 id="app-header-title" class="text-sm font-extrabold truncate">Study Tracker</h1>
        </div>
      </div>
      <div id="app-header-meta" class="flex items-center gap-1.5 shrink-0"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app-main" class="app-container mx-auto px-3.5 py-4"></main>

  <!-- Slide-out Glass Navigation Drawer -->
  <div id="app-drawer-backdrop" class="app-drawer-backdrop" aria-hidden="true"></div>
  <aside id="app-drawer" class="app-drawer" aria-hidden="true" aria-label="Navigation Menu">
    <div class="app-drawer-header">
      <button id="app-drawer-profile-btn" type="button" class="drawer-profile-card">
        <span id="drawer-prof-avatar" class="drawer-prof-avatar">🦉</span>
        <div class="min-w-0 flex-1 text-start">
          <div id="app-drawer-title" class="text-sm font-extrabold truncate">Study Tracker</div>
          <div id="app-drawer-subtitle" class="text-[11px] text-slate-500 dark:text-slate-400 truncate">View Profile ›</div>
        </div>
      </button>
      <button id="app-drawer-close" type="button" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 text-lg leading-none shrink-0" aria-label="Close">×</button>
    </div>
    <nav id="app-drawer-nav" class="app-drawer-nav"></nav>
    <div id="app-drawer-footer" class="app-drawer-footer"></div>
  </aside>

  <!-- Toast Notification -->
  <div id="app-toast" class="hidden opacity-0"></div>

  <!-- Custom Modal -->
  <div id="app-modal-backdrop" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl w-full max-w-sm shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
        <h3 id="app-modal-title" class="text-sm font-bold text-slate-800 dark:text-slate-100"></h3>
        <button type="button" onclick="window.AppUI.closeModal()" class="text-slate-400 hover:text-slate-600 text-lg leading-none">×</button>
      </div>
      <div id="app-modal-body" class="p-4"></div>
      <div id="app-modal-footer" class="px-4 py-3 bg-slate-50 dark:bg-slate-900/50 flex justify-end gap-2"></div>
    </div>
  </div>

  <!-- Core Boot JS Files (Tab modules are lazy-loaded on demand by app.js) -->
  <script defer src="js/config.js?v=78"></script>
  <script defer src="js/i18n.js?v=78"></script>
  <script defer src="js/state.js?v=78"></script>
  <script defer src="js/google-sync.js?v=78"></script>
  <script defer src="js/push.js?v=78"></script>
  <script defer src="js/ledger.js?v=78"></script>
  <script defer src="js/ui.js?v=78"></script>
  <script defer src="js/app.js?v=78"></script>
</body>
</html>
